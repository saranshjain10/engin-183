name: Update gas prices

# EIA publishes weekly retail gasoline prices on Monday afternoons (Eastern),
# sometimes Tuesday after a holiday. Run Tuesday and Wednesday mornings to be safe.
on:
  schedule:
    - cron: "17 14 * * 2,3"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch prices from the EIA API
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: node gas-map/fetch-prices.js
      - name: Commit prices.json if the week changed
        id: commit
        run: |
          if git diff --quiet -I '"fetchedAt"' -- gas-map/prices.json; then
            echo "No new week of prices."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gas-map/prices.json
            git commit -m "Update gas prices from EIA"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on its own."
